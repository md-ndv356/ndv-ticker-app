<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Test</title>
    <link rel="stylesheet" href="style_new.css">
</head>
<body>
    <div class="container">
        <h1>Modal Test</h1>
        <button type="button" class="btn btn-secondary" id="add-ticker-text">
            ティッカーテキストを追加
        </button>

        <!-- Ticker Text Modal -->
        <div id="ticker-text-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title">通常画面テキストを追加</h3>
                    <button class="modal-close">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="ticker-text-title">タイトル (オプション)</label>
                        <input type="text" id="ticker-text-title" class="modal-input" placeholder="通常画面テキストのタイトル">
                    </div>

                    <div class="form-group">
                        <label class="text-type-label">テキストタイプ</label>
                        <div class="text-type-selector">
                            <label class="radio-option">
                                <input type="radio" name="text-type" value="custom" id="text-type-custom" checked>
                                <span class="radio-label">メッセージを作る</span>
                                <p class="radio-description">リッチテキストエディタでカスタムメッセージを作成</p>
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="text-type" value="shortcut" id="text-type-shortcut">
                                <span class="radio-label">ショートカット</span>
                                <p class="radio-description">スタイルが完成された定型メッセージを選択</p>
                            </label>
                        </div>
                    </div>

                    <!-- Custom Text Section -->
                    <div class="form-group" id="custom-text-section">
                        <label>メッセージ内容</label>
                        <div class="rich-text-editor-control">
                            <button type="button" id="open-rich-text-editor" class="btn btn-primary">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M14,17H7V15H14M17,13H7V11H17M17,9H7V7H17M19,3H5C3.89,3 3,3.89 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5C21,3.89 20.1,3 19,3Z"/>
                                </svg>
                                リッチテキストエディタで編集
                            </button>
                            <div id="rich-text-preview" class="rich-text-preview">
                                <p class="preview-placeholder">編集ボタンをクリックしてメッセージを作成してください</p>
                            </div>
                        </div>
                    </div>

                    <!-- Shortcut Preset Section -->
                    <div class="form-group" id="shortcut-info-section" style="display: none;">
                        <label>定型メッセージ</label>
                        <div class="shortcut-options">
                            <label class="radio-option shortcut-option">
                                <input type="radio" name="shortcut-type" value="temperature" id="shortcut-temperature" checked>
                                <span class="radio-label">天気概況メッセージ</span>
                                <p class="radio-description">気温と天気の状況を含む完成されたメッセージ</p>
                            </label>
                            <label class="radio-option shortcut-option">
                                <input type="radio" name="shortcut-type" value="precipitation" id="shortcut-precipitation">
                                <span class="radio-label">降水情報メッセージ</span>
                                <p class="radio-description">降水量と予報を含む完成されたメッセージ</p>
                            </label>
                        </div>
                    </div>

                    <!-- Preview Section -->
                    <div class="text-preview">
                        <label>プレビュー:</label>
                        <div id="ticker-text-preview" class="preview-area">プレビューがここに表示されます</div>
                    </div>

                    <div class="modal-checkbox-container">
                        <input type="checkbox" id="ticker-text-enabled" class="modal-checkbox" checked>
                        <label for="ticker-text-enabled" class="modal-checkbox-label">有効にする</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="modal-button modal-button-secondary" id="cancel-ticker-text">キャンセル</button>
                    <button type="button" class="modal-button modal-button-primary" id="save-ticker-text">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Simple test script to check modal functionality
        document.addEventListener('DOMContentLoaded', function() {
            const addButton = document.getElementById('add-ticker-text');
            const modal = document.getElementById('ticker-text-modal');
            const closeBtn = modal.querySelector('.modal-close');
            const cancelBtn = document.getElementById('cancel-ticker-text');

            addButton.addEventListener('click', function() {
                console.log('Add button clicked');
                modal.style.display = 'block';
            });

            function closeModal() {
                console.log('Closing modal');
                modal.style.display = 'none';
            }

            closeBtn.addEventListener('click', closeModal);
            cancelBtn.addEventListener('click', closeModal);

            // Close modal on background click
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    closeModal();
                }
            });

            // Text type change handler
            const textTypeInputs = document.querySelectorAll('input[name="text-type"]');
            textTypeInputs.forEach(input => {
                input.addEventListener('change', function() {
                    console.log('Text type changed to:', this.value);
                    const customSection = document.getElementById('custom-text-section');
                    const shortcutSection = document.getElementById('shortcut-info-section');
                    const previewElement = document.getElementById('rich-text-preview');

                    if (this.value === 'custom') {
                        customSection.style.display = 'block';
                        shortcutSection.style.display = 'none';

                        // Test rich text preview with sample content
                        if (previewElement) {
                            previewElement.innerHTML = '<div class="rich-content">サンプルテキスト: NDVティッカーへようこそ</div>';
                        }
                    } else {
                        customSection.style.display = 'none';
                        shortcutSection.style.display = 'block';

                        if (previewElement) {
                            previewElement.innerHTML = '<p class="preview-placeholder">ショートカット選択中</p>';
                        }
                    }
                });
            });

            console.log('Test modal initialized');
        });
    </script>
</body>
</html>
