<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メッセージを作る - NDV</title>
  <link rel="stylesheet" href="../setting/style_new.css">
  <link rel="stylesheet" href="./rich-text-editor.css">
</head>
<body>
  <div class="editor-container">
    <!-- ヘッダー -->
    <header class="editor-header">
      <h1>📝 メッセージを作る</h1>
      <div class="header-actions">
        <button class="btn btn-secondary" id="cancel-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
          キャンセル
        </button>
        <button class="btn btn-primary" id="save-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17,21 17,13 7,13 7,21"></polyline>
            <polyline points="7,3 7,8 15,8"></polyline>
          </svg>
          保存する
        </button>
      </div>
    </header>

    <!-- メインコンテンツ -->
    <div class="editor-content">
      <!-- 左パネル：エディタ -->
      <div class="editor-panel">
        <!-- 装飾ツールバー -->
        <div class="decoration-toolbar">
          <div class="toolbar-title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
            </svg>
            文字を装飾する
          </div>

          <div class="toolbar-groups">
            <!-- スタイルボタン -->
            <div class="style-buttons">
              <button class="style-btn" id="bold-btn" title="太字にする">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
                  <path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
                </svg>
                太字
              </button>
              <button class="style-btn" id="italic-btn" title="斜体にする">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="19" y1="4" x2="10" y2="4"></line>
                  <line x1="14" y1="20" x2="5" y2="20"></line>
                  <line x1="15" y1="4" x2="9" y2="20"></line>
                </svg>
                斜体
              </button>
              <button class="style-btn" id="underline-btn" title="下線をつける">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M6 3v7a6 6 0 0 0 6 6 6 6 0 0 0 6-6V3"></path>
                  <line x1="4" y1="21" x2="20" y2="21"></line>
                </svg>
                下線
              </button>
            </div>

            <!-- 色とサイズ -->
            <div class="appearance-controls">
              <div class="color-picker">
                <label for="text-color">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                    <line x1="9" y1="9" x2="9.01" y2="9"></line>
                    <line x1="15" y1="9" x2="15.01" y2="9"></line>
                  </svg>
                  文字の色
                </label>
                <input type="color" id="text-color" value="#ffffff" title="選択範囲を保持したまま色を変更できます">
              </div>
              <div class="size-picker">
                <label for="font-size">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="4,7 4,4 20,4 20,7"></polyline>
                    <line x1="9" y1="20" x2="15" y2="20"></line>
                    <line x1="12" y1="4" x2="12" y2="20"></line>
                  </svg>
                  文字のサイズ
                </label>
                <input type="number" id="font-size" value="16" min="10" max="32" title="選択範囲を保持したままフォントサイズを変更できます">
              </div>
            </div>
          </div>
        </div>

        <!-- メッセージ入力エリア -->
        <div class="message-input">
          <label for="rich-text-area">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
            ティッカーに表示するメッセージを書いてください
          </label>
          <div id="rich-text-area" contenteditable="true" class="rich-editor-area" placeholder="ここにメッセージを入力してください。文字を選択すると装飾できます 🎨"></div>
        </div>
      </div>

      <!-- 右パネル：プレビューと素材 -->
      <div class="preview-panel">
        <!-- プレビュー -->
        <div class="preview-section">
          <div class="section-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="23 7 16 12 23 17 23 7"></polygon>
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
            </svg>
            ティッカーでの見た目
          </div>
          <p class="section-description">実際にティッカーで流れる時の表示イメージです</p>
          <div class="ticker-preview">
            <div class="preview-label">画面上での表示</div>
            <div id="preview-content" class="preview-ticker">
              ここにプレビューが表示されます
            </div>
          </div>
        </div>

        <!-- 素材パネル -->
        <div class="materials-panel">
          <div class="section-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1 1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            素材を追加
          </div>
          <p class="section-description">アイコンやリアルタイム情報をメッセージに追加できます</p>

          <!-- 素材タブ -->
          <div class="material-tabs">
            <button class="material-tab active" data-tab="data">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
              </svg>
              リアルタイム情報
            </button>
            <button class="material-tab" data-tab="icons">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
              </svg>
              アイコン
            </button>
          </div>

          <!-- リアルタイム情報一覧 -->
          <div class="material-content" id="data-content">
            <div class="data-category">
              <h4>🌤️ 天気の情報</h4>
              <div class="data-list">
                <button class="data-item" data-variable="weather/temperature/high">
                  <div class="data-name">今日の最高気温</div>
                  <div class="data-code">&lt;weather/temperature/high&gt;</div>
                </button>
                <button class="data-item" data-variable="weather/temperature/low">
                  <div class="data-name">今日の最低気温</div>
                  <div class="data-code">&lt;weather/temperature/low&gt;</div>
                </button>
                <button class="data-item" data-variable="weather/rain/1h">
                  <div class="data-name">1時間の雨量</div>
                  <div class="data-code">&lt;weather/rain/1h&gt;</div>
                </button>
                <button class="data-item" data-variable="weather/wind/speed">
                  <div class="data-name">風の強さ</div>
                  <div class="data-code">&lt;weather/wind/speed&gt;</div>
                </button>
              </div>
            </div>

            <div class="data-category">
              <h4>🌍 地震の情報</h4>
              <div class="data-list">
                <button class="data-item" data-variable="earthquake/latest/magnitude">
                  <div class="data-name">最新地震のマグニチュード</div>
                  <div class="data-code">&lt;earthquake/latest/magnitude&gt;</div>
                </button>
                <button class="data-item" data-variable="earthquake/latest/location">
                  <div class="data-name">最新地震の場所</div>
                  <div class="data-code">&lt;earthquake/latest/location&gt;</div>
                </button>
                <button class="data-item" data-variable="earthquake/latest/intensity">
                  <div class="data-name">最大震度</div>
                  <div class="data-code">&lt;earthquake/latest/intensity&gt;</div>
                </button>
              </div>
            </div>

            <div class="data-category">
              <h4>⏰ 時間の情報</h4>
              <div class="data-list">
                <button class="data-item" data-variable="time/current">
                  <div class="data-name">現在時刻</div>
                  <div class="data-code">&lt;time/current&gt;</div>
                </button>
                <button class="data-item" data-variable="time/date">
                  <div class="data-name">今日の日付</div>
                  <div class="data-code">&lt;time/date&gt;</div>
                </button>
              </div>
            </div>
          </div>

          <!-- アイコン一覧 -->
          <div class="material-content" id="icons-content" style="display: none;">
            <div class="icon-category">
              <h4>🌤️ 天気のアイコン</h4>
              <div class="icon-grid">
                <button class="icon-item" data-icon="weather:sunny" title="晴れ">☀️</button>
                <button class="icon-item" data-icon="weather:cloudy" title="曇り">☁️</button>
                <button class="icon-item" data-icon="weather:rainy" title="雨">🌧️</button>
                <button class="icon-item" data-icon="weather:snowy" title="雪">❄️</button>
                <button class="icon-item" data-icon="weather:stormy" title="嵐">⛈️</button>
                <button class="icon-item" data-icon="weather:foggy" title="霧">🌫️</button>
              </div>
            </div>

            <div class="icon-category">
              <h4>🌍 災害のアイコン</h4>
              <div class="icon-grid">
                <button class="icon-item" data-icon="disaster:earthquake" title="地震">🌍</button>
                <button class="icon-item" data-icon="disaster:tsunami" title="津波">🌊</button>
                <button class="icon-item" data-icon="disaster:volcano" title="火山">🌋</button>
                <button class="icon-item" data-icon="disaster:flood" title="洪水">💧</button>
              </div>
            </div>

            <div class="icon-category">
              <h4>⚠️ 注意・警告</h4>
              <div class="icon-grid">
                <button class="icon-item" data-icon="alert:warning" title="注意">⚠️</button>
                <button class="icon-item" data-icon="alert:danger" title="危険">🚨</button>
                <button class="icon-item" data-icon="alert:info" title="お知らせ">ℹ️</button>
                <button class="icon-item" data-icon="alert:check" title="OK">✅</button>
                <button class="icon-item" data-icon="alert:error" title="エラー">❌</button>
              </div>
            </div>

            <div class="icon-category">
              <h4>📍 方向・移動</h4>
              <div class="icon-grid">
                <button class="icon-item" data-icon="direction:up" title="上">⬆️</button>
                <button class="icon-item" data-icon="direction:down" title="下">⬇️</button>
                <button class="icon-item" data-icon="direction:left" title="左">⬅️</button>
                <button class="icon-item" data-icon="direction:right" title="右">➡️</button>
                <button class="icon-item" data-icon="direction:location" title="場所">📍</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./text-manager.js"></script>
  <script src="./rich-text-editor.js"></script>
</body>
</html>
